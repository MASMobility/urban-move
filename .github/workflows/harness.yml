name: harness

# Keeps the agent harness and the function registry consistent on every change.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Registry tool tests
        run: node --test .claude/skills/functions-registry/scripts/
      - name: functions.json is valid and backend/README.md is up to date
        run: node .claude/skills/functions-registry/scripts/functions.mjs check
      - name: Skills, agents and config are consistent
        run: python scripts/check_harness.py
